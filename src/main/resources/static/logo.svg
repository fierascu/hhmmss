<svg width="400" height="200" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200">
  <defs>
    <style>
      .doc-icon { fill: #2b579a; }
      .xls-icon { fill: #217346; }
      .pdf-icon { fill: #dc3545; }
      .arrow { fill: #666666; }
      .text {
        font-family: 'Courier New', monospace;
        font-size: 16px;
        font-weight: bold;
        fill: white;
      }
      .label {
        font-family: 'Courier New', monospace;
        font-size: 14px;
        font-weight: bold;
      }
    </style>
  </defs>

  <!-- XLS Source Document (Left) -->
  <g id="xls-source">
    <!-- Document shape -->
    <rect x="20" y="50" width="80" height="100" rx="4" class="xls-icon"/>
    <!-- Folded corner -->
    <path d="M 90 50 L 90 60 L 100 60 L 100 50 Z" fill="#1a5c34"/>
    <path d="M 90 60 L 100 50" stroke="#1a5c34" stroke-width="2"/>

    <!-- Grid pattern to represent spreadsheet -->
    <line x1="40" y1="80" x2="90" y2="80" stroke="white" stroke-width="1.5" opacity="0.4"/>
    <line x1="40" y1="95" x2="90" y2="95" stroke="white" stroke-width="1.5" opacity="0.4"/>
    <line x1="40" y1="110" x2="90" y2="110" stroke="white" stroke-width="1.5" opacity="0.4"/>
    <line x1="55" y1="70" x2="55" y2="140" stroke="white" stroke-width="1.5" opacity="0.4"/>
    <line x1="72" y1="70" x2="72" y2="140" stroke="white" stroke-width="1.5" opacity="0.4"/>

    <!-- XLS text -->
    <text x="60" y="105" class="text" text-anchor="middle">XLS</text>

    <!-- Label -->
    <text x="60" y="170" class="label xls-icon" text-anchor="middle">Source</text>
  </g>

  <!-- Arrow 1 (Upper - to DOC) -->
  <g id="arrow-upper">
    <path d="M 115 75 L 220 50" class="arrow" stroke="#666666" stroke-width="3" fill="none"/>
    <polygon points="220,50 210,45 210,55" class="arrow"/>
    <text x="165" y="55" style="font-family: monospace; font-size: 12px; fill: #666666;">convert</text>
  </g>

  <!-- Arrow 2 (Lower - to PDF) -->
  <g id="arrow-lower">
    <path d="M 115 125 L 220 150" class="arrow" stroke="#666666" stroke-width="3" fill="none"/>
    <polygon points="220,150 210,145 210,155" class="arrow"/>
    <text x="165" y="145" style="font-family: monospace; font-size: 12px; fill: #666666;">convert</text>
  </g>

  <!-- DOC Document (Upper Right) -->
  <g id="doc-target">
    <!-- Document shape -->
    <rect x="240" y="20" width="80" height="80" rx="4" class="doc-icon"/>
    <!-- Folded corner -->
    <path d="M 310 20 L 310 30 L 320 30 L 320 20 Z" fill="#1e3f6e"/>
    <path d="M 310 30 L 320 20" stroke="#1e3f6e" stroke-width="2"/>

    <!-- Document lines -->
    <line x1="255" y1="45" x2="305" y2="45" stroke="white" stroke-width="2" opacity="0.5"/>
    <line x1="255" y1="55" x2="305" y2="55" stroke="white" stroke-width="2" opacity="0.5"/>
    <line x1="255" y1="65" x2="295" y2="65" stroke="white" stroke-width="2" opacity="0.5"/>
    <line x1="255" y1="75" x2="305" y2="75" stroke="white" stroke-width="2" opacity="0.5"/>
    <line x1="255" y1="85" x2="285" y2="85" stroke="white" stroke-width="2" opacity="0.5"/>

    <!-- DOC text -->
    <text x="280" y="62" class="text" text-anchor="middle" font-size="14px">DOC</text>

    <!-- Label -->
    <text x="280" y="120" class="label doc-icon" text-anchor="middle">Document</text>
  </g>

  <!-- PDF Document (Lower Right) -->
  <g id="pdf-target">
    <!-- Document shape -->
    <rect x="240" y="120" width="80" height="80" rx="4" class="pdf-icon"/>
    <!-- Folded corner -->
    <path d="M 310 120 L 310 130 L 320 130 L 320 120 Z" fill="#a02a36"/>
    <path d="M 310 130 L 320 120" stroke="#a02a36" stroke-width="2"/>

    <!-- PDF symbol -->
    <text x="280" y="150" class="text" text-anchor="middle" font-size="28px" font-weight="bold">PDF</text>
    <circle cx="280" cy="175" r="15" fill="none" stroke="white" stroke-width="2" opacity="0.4"/>

    <!-- Label -->
    <text x="280" y="215" class="label pdf-icon" text-anchor="middle">Portable</text>
  </g>
</svg>
